{% extends '_base.html' %}

{% block content %}
    <h1>{{ blog.title }}</h1>
    <p><strong>Autor:</strong> {{ blog.author }}</p>
    <p><strong>Fecha de creación:</strong> {{ blog.created_at }}</p>
    <div>
        <p>{{ blog.content }}</p>
    </div>
    <a href="{% url 'post-update' blog.pk %}">Editar post</a>
    <a href="{% url 'post-delete' blog.pk %}">Eliminar post</a>
{% endblock content %}
